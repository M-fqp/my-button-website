<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#dff6ff,#f4f8ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{background:#fff;width:100%;max-width:520px;padding:42px 26px;border-radius:24px;text-align:center;box-shadow:0 10px 35px rgba(0,70,120,.12)}
h1{color:#1261a0;margin:0 0 12px} p{color:#65758b;line-height:1.9}
button{background:#1677c8;color:#fff;border:0;padding:15px 35px;border-radius:12px;font-size:18px;cursor:pointer;margin-top:15px;transition:.2s}
button:hover{background:#0d5593;transform:translateY(-2px)}
#message{display:none;margin-top:25px;padding:20px;background:#eef8ff;border-radius:12px;color:#174d78;font-size:18px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="container">
<h1>أهلاً وسهلاً 👋</h1>
<p>اضغط على الزر بالأسفل لعرض الرسالة</p>
<button type="button" onclick="showMessage()">اضغط هنا</button>
<div id="message" role="status" aria-live="polite"></div>
</main>
<script>
const myMessage = "هنا اكتب الكلام اللي تبيه يظهر للمستخدم";
function showMessage(){
  const box=document.getElementById("message");
  box.textContent=myMessage;
  box.style.display="block";
}
</script>
</body>
</html>
